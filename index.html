<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICU 脓毒症 CRF 一期原型</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">省儿童 PICU 专病数据库</p>
          <h1>脓毒症 CRF 填审工作台</h1>
        </div>
        <nav class="tabs" aria-label="主导航">
          <button class="tab is-active" data-view="dashboard" type="button">病例工作台</button>
          <button class="tab" data-view="raw" type="button">原始资料</button>
          <button class="tab" data-view="crf" type="button">CRF 填审</button>
          <button class="tab" data-view="mapping" type="button">字段映射</button>
        </nav>
      </header>

      <main>
        <section class="view is-active" id="dashboard-view" aria-label="病例工作台">
          <div class="summary-grid" id="dashboard-summary"></div>
          <div class="workspace-band">
            <div class="section-heading">
              <div>
                <p class="eyebrow">单病种队列</p>
                <h2>待处理病例</h2>
              </div>
              <div class="source-legend" id="source-legend"></div>
            </div>
            <div class="case-table-wrap">
              <table class="case-table">
                <thead>
                  <tr>
                    <th>病例号</th>
                    <th>床位</th>
                    <th>诊断摘要</th>
                    <th>负责人</th>
                    <th>CRF 完成度</th>
                    <th>待办</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="case-table-body"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="view" id="raw-view" aria-label="原始资料">
          <div class="raw-shell">
            <div class="raw-header" id="raw-case-strip"></div>
            <div class="subtabs" aria-label="原始资料展示方式">
              <button class="subtab is-active" data-raw-mode="organized" type="button">按来源整理</button>
              <button class="subtab" data-raw-mode="tables" type="button">原始多表</button>
            </div>

            <div class="raw-mode is-active" id="raw-organized"></div>

            <div class="raw-mode" id="raw-tables">
              <aside class="raw-table-nav" id="raw-table-list"></aside>
              <section class="raw-table-main">
                <div class="section-heading">
                  <div>
                    <p class="eyebrow" id="raw-table-system"></p>
                    <h2 id="raw-table-title"></h2>
                  </div>
                  <button class="confirm-btn" id="raw-table-to-crf" type="button">关联字段</button>
                </div>
                <div class="raw-table-wrap">
                  <table class="raw-data-table">
                    <thead id="raw-table-head"></thead>
                    <tbody id="raw-table-body"></tbody>
                  </table>
                </div>
              </section>
            </div>
          </div>
        </section>

        <section class="view" id="crf-view" aria-label="CRF 填审">
          <div class="crf-layout">
            <aside class="module-panel">
              <div class="panel-title">
                <span>模块</span>
                <strong id="module-count"></strong>
              </div>
              <div id="module-list" class="module-list"></div>
            </aside>

            <section class="form-panel">
              <div class="case-strip" id="case-strip"></div>
              <div class="filter-row">
                <label>
                  <span>状态</span>
                  <select id="status-filter">
                    <option value="all">全部</option>
                    <option value="auto_filled">已自动带入</option>
                    <option value="manual_required">需手填</option>
                    <option value="review_required">需确认</option>
                    <option value="missing">缺失</option>
                    <option value="source_unclear">来源不明确</option>
                  </select>
                </label>
                <label class="search-box">
                  <span>搜索</span>
                  <input id="field-search" type="search" placeholder="字段、来源、备注" />
                </label>
              </div>
              <div id="field-list" class="field-list"></div>
            </section>

            <aside class="evidence-panel">
              <div class="panel-title">
                <span>来源证据</span>
                <strong id="evidence-system"></strong>
              </div>
              <div id="evidence-detail"></div>
            </aside>
          </div>
        </section>

        <section class="view" id="mapping-view" aria-label="字段映射">
          <div class="mapping-tools">
            <label>
              <span>来源系统</span>
              <select id="mapping-source"></select>
            </label>
            <label>
              <span>模块</span>
              <select id="mapping-module"></select>
            </label>
            <label>
              <span>输入方式</span>
              <select id="mapping-input"></select>
            </label>
            <label class="search-box">
              <span>搜索</span>
              <input id="mapping-search" type="search" placeholder="字段、选项、来源" />
            </label>
          </div>
          <div class="mapping-table-wrap">
            <table class="mapping-table">
              <thead>
                <tr>
                  <th>模块</th>
                  <th>字段</th>
                  <th>选项/单位</th>
                  <th>来源系统</th>
                  <th>数据来源</th>
                  <th>输入方式</th>
                  <th>标注</th>
                </tr>
              </thead>
              <tbody id="mapping-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="./src/data.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
